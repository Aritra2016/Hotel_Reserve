<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayEase Hotel API - Swagger Documentation</title>
  <!-- Swagger UI CSS stylesheet from official unpkg CDN -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .swagger-header {
      background: linear-gradient(135deg, #ff385c 0%, #e00b41 100%);
      color: #ffffff;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .swagger-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }
    .swagger-header a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .swagger-header a:hover {
      background: rgba(255, 255, 255, 0.35);
    }
    .swagger-info-card {
      max-width: 1460px;
      margin: 16px auto 0 auto;
      padding: 0 20px;
    }
    .specs-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-size: 13px;
    }
    .specs-table th {
      background: #2d3748;
      color: #ffffff;
      text-align: left;
      padding: 10px 14px;
    }
    .specs-table td {
      padding: 9px 14px;
      border-bottom: 1px solid #edf2f7;
      color: #4a5568;
    }
  </style>
</head>
<body>
  <header class="swagger-header">
    <h1>🏨 StayEase API Interactive Documentation</h1>
    <a href="/" target="_self">← Back to App</a>
  </header>

  <section class="swagger-info-card">
    <table class="specs-table" aria-label="API Specifications Overview">
      <thead>
        <tr>
          <th scope="col">Specification</th>
          <th scope="col">Version</th>
          <th scope="col">Source File</th>
          <th scope="col">Active Host</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>OpenAPI / Swagger</strong></td>
          <td>3.0.3</td>
          <td><code>assets/swagger/swagger.yaml</code></td>
          <td><code>http://localhost:4200/api</code></td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- Container element where Swagger UI renders -->
  <div id="swagger-ui"></div>

  <!-- Swagger UI Bundle JS CDN scripts -->
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    // Initialize Swagger UI once document loads
    window.onload = function() {
      // Configuration object pointing to our local swagger.yaml file
      const ui = SwaggerUIBundle({
        // URL path pointing to our swagger.yaml asset
        url: './swagger.yaml',
        // DOM element selector
        dom_id: '#swagger-ui',
        // Enable deep linking into endpoints
        deepLinking: true,
        // Preset configurations
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        // Default plugins
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        // Layout configuration
        layout: 'BaseLayout'
      });
      // Store UI instance on window for console debugging
      window.ui = ui;
    };
  </script>
</body>
</html>
