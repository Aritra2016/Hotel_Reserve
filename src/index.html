<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HotelReserve</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root>
    <style>
      .app-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 999999;
      }
      .boot-spinner-wrap {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }
      .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(255, 56, 92, 0.15);
        border-top-color: #ff385c;
        animation: bootSpin 1s linear infinite;
      }
      .boot-logo {
        animation: bootPulse 1.8s ease-in-out infinite;
      }
      .boot-text {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #ff385c;
        margin-bottom: 6px;
      }
      .boot-sub {
        font-size: 13px;
        color: #64748b;
      }
      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
    </style>
    <div class="app-boot-loader">
      <div class="boot-spinner-wrap">
        <div class="boot-ring"></div>
        <div class="boot-logo">
          <svg width="28" height="30" viewBox="0 0 30 32" fill="#ff385c" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 0C9.5 0 5 5.2 5 11.6c0 7.8 10 20.4 10 20.4s10-12.6 10-20.4C25 5.2 20.5 0 15 0zm0 16a4.4 4.4 0 110-8.8A4.4 4.4 0 0115 16z"/>
          </svg>
        </div>
      </div>
      <div class="boot-text">STAYEASE</div>
      <div class="boot-sub">Loading your luxury stay experience...</div>
    </div>
  </app-root>
</body>
</html>
