<header class="navbar">
  <div class="container navbar__inner">
    <a routerLink="/" class="navbar__logo" (click)="closeMobileMenu()">
      <svg width="28" height="30" viewBox="0 0 30 32" fill="var(--color-primary)" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 0C9.5 0 5 5.2 5 11.6c0 7.8 10 20.4 10 20.4s10-12.6 10-20.4C25 5.2 20.5 0 15 0zm0 16a4.4 4.4 0 110-8.8A4.4 4.4 0 0115 16z"/>
      </svg>
      <span class="navbar__brand">StayEase</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="navbar__links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
      <a routerLink="/listings" routerLinkActive="active">Explore</a>
    </nav>

    <!-- Desktop Actions -->
    <div class="navbar__actions">
      <a routerLink="/listings" class="btn-outline host-cta-btn">Become a Host</a>
      <button class="navbar__avatar" aria-label="User menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button
        type="button"
        class="navbar__hamburger"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-label="Toggle navigation menu"
      >
        <svg *ngIf="!isMobileMenuOpen" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg *ngIf="isMobileMenuOpen" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Navigation Menu -->
  <div class="navbar__mobile-menu" [class.navbar__mobile-menu--open]="isMobileMenuOpen">
    <div class="container mobile-menu__inner">
      <nav class="mobile-nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMobileMenu()">
          <span class="mobile-nav-icon">🏠</span>
          <span>Home</span>
        </a>
        <a routerLink="/listings" routerLinkActive="active" (click)="closeMobileMenu()">
          <span class="mobile-nav-icon">🔍</span>
          <span>Explore Stays</span>
        </a>
        <a routerLink="/listings" class="mobile-host-link" (click)="closeMobileMenu()">
          <span class="mobile-nav-icon">✨</span>
          <span>Become a Host</span>
        </a>
      </nav>
    </div>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__copy">
      <span>© 2024 StayEase, Inc. All rights reserved.</span>
    </div>
    <nav class="footer__links">
      <a href="javascript:void(0)">Privacy</a>
      <a href="javascript:void(0)">Terms</a>
      <a href="javascript:void(0)">Sitemap</a>
      <a href="javascript:void(0)">Destinations</a>
    </nav>
  </div>
</footer>
